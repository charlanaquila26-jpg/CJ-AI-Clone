<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJ AI Clone</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#151b2a;background:#f7f9fb}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{background:#fff;width:235px;padding:26px 16px;border-right:1px solid #e8edf4}h1{font-size:21px;letter-spacing:-.7px;margin:0 0 30px}.brand{color:#f26736}nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 15px;border-radius:11px;color:#536173;font-size:14px;cursor:pointer}nav button.active{color:#111c2d;background:#f0f3f7;font-weight:700}main{flex:1;padding:34px 4%;max-width:1300px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h2{font-size:27px;letter-spacing:-.9px;margin:0 0 8px}p{color:#778391}.card{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:24px;margin:24px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fff;border:1px solid #e6eaf0;border-radius:15px;padding:22px}.stat b{display:block;font-size:28px;margin:12px 0}input,textarea{width:100%;padding:12px;border:1px solid #dfe5ed;border-radius:10px;font:inherit;margin:8px 0}button.primary{background:#202b42;color:white;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}button.outline{background:white;border:1px solid #dfe5ed;border-radius:10px;padding:12px 16px;cursor:pointer}.hidden{display:none!important}.row{display:flex;gap:12px;align-items:center}.muted{color:#8390a0;font-size:13px}.error{color:#bb3030}.success{color:#237a50}.item{padding:13px 0;border-bottom:1px solid #eef1f4}.pill{background:#fff4e9;color:#ad5b14;padding:6px 9px;border-radius:30px;font-size:12px}.login{max-width:430px;margin:12vh auto;padding:34px}.chatlog{height:370px;overflow:auto;border:1px solid #e9edf3;border-radius:10px;padding:16px;background:#fdfefe}.bubble{padding:12px 16px;border-radius:12px;margin:8px 0;max-width:85%}.mine{background:#e8edf8;margin-left:auto}.theirs{background:#f3f5f7}@media(max-width:700px){aside{width:160px}main{padding:18px}.stats{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style></head><body>
<div id="login" class="card login"><h1><span class="brand">✦</span> CJ AI Clone</h1><h2>Private workspace</h2><p>Sign in with your personal Supabase account.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><p id="loginmsg" class="error"></p></div>
<div class="app hidden" id="app"><aside><h1><span class="brand">✦</span> CJ AI Clone</h1><nav id="nav"></nav><p class="muted" style="margin-top:42px">Personal · Private</p><button class="outline" onclick="logout()">Sign out</button></aside><main><header><div><h2 id="heading">Overview</h2><p id="subtitle">Your own personal AI workspace</p></div><span class="pill">$25 AI budget target</span></header><div id="content"></div></main></div>
<script type="module">
import{createClient}from 'https://esm.sh/@supabase/supabase-js@2';
let db=null,user=null,section='Overview', conversationId=null; const $=id=>document.getElementById(id); const routes=['Overview','Chat','Tasks','Memory','Approvals','Activity','Usage','Settings'];
async function init(){let config=await(await fetch('/api/config')).json();if(!config.supabase_url||!config.supabase_key){$('loginmsg').textContent='Setup required: configure Supabase Worker variables.';return}db=createClient(config.supabase_url,config.supabase_key);const{data}=await db.auth.getUser();if(data.user){user=data.user;launch()}}
window.login=async()=>{if(!db)return;const{data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginmsg').textContent=error.message;return}user=data.user;launch()};window.logout=async()=>{await db.auth.signOut();location.reload()};
function launch(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').innerHTML=routes.map(x=>`<button data-route="${x}" class="${x===section?'active':''}">${x}</button>`).join('');$('nav').onclick=e=>{if(e.target.dataset.route){section=e.target.dataset.route;launch()}};show()}
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rows(table){const {data,error}=await db.from(table).select('*').order('created_at',{ascending:false}).limit(100);if(error)throw Error(error.message);return data||[]}
async function show(){const c=$('content');$('heading').textContent=section;$('subtitle').textContent='Your private personal AI operating system';c.innerHTML='<div class="card">Loading...</div>';try{
if(section==='Overview'){let[t,a,m,u]=await Promise.all(['tasks','approvals','memories','usage_events'].map(rows));c.innerHTML=`<div class="stats"><div class="stat">Active tasks<b>${t.filter(x=>x.status!=='completed').length}</b></div><div class="stat">Pending approvals<b>${a.filter(x=>x.status==='pending').length}</b></div><div class="stat">Saved memories<b>${m.length}</b></div></div><div class="card"><h3>Ready to work</h3><p>Organize your projects, save memories, and create tasks. OpenAI chat requires additional secure server configuration.</p></div>`}
else if(section==='Tasks'){const a=await rows('tasks');c.innerHTML=`<div class="card"><h3>Add a task</h3><input id="title" placeholder="What needs to be done?"><button class="primary" id="add">Create task</button></div><div class="card">${a.map(x=>`<div class="item"><strong>${escapeHtml(x.title)}</strong> · ${escapeHtml(x.status)}</div>`).join('')||'No tasks yet'}</div>`;$('add').onclick=async()=>{let v=$('title').value.trim();if(v){await db.from('tasks').insert({owner_id:user.id,title:v});show()}}}
else if(section==='Memory'){const a=await rows('memories');c.innerHTML=`<div class="card"><h3>Save an instruction or preference</h3><textarea id="memory" placeholder="Something CJ AI Clone should remember..."></textarea><button class="primary" id="add">Save memory</button></div><div class="card">${a.map(x=>`<div class="item">${escapeHtml(x.content)}</div>`).join('')||'No memories yet'}</div>`;$('add').onclick=async()=>{let v=$('memory').value.trim();if(v){await db.from('memories').insert({owner_id:user.id,content:v});show()}}}
else if(section==='Approvals'){const a=await rows('approvals');c.innerHTML=`<div class="card"><h3>Approval queue</h3>${a.map(x=>`<div class="item"><strong>${escapeHtml(x.title)}</strong><p>${escapeHtml(x.description)}</p><span class="pill">${escapeHtml(x.status)}</span></div>`).join('')||'No approvals pending'}</div>`}
else if(section==='Activity'){const a=await rows('activity_logs');c.innerHTML=`<div class="card"><h3>Activity history</h3>${a.map(x=>`<div class="item">${escapeHtml(x.event)} · ${escapeHtml(x.details)}</div>`).join('')||'No activity yet'}</div>`}
else if(section==='Usage'){const a=await rows('usage_events');const month=new Date().toISOString().slice(0,7);const spend=a.filter(x=>x.created_at.startsWith(month)).reduce((sum,x)=>sum+Number(x.estimated_cost_usd),0);c.innerHTML=`<div class="stats"><div class="stat">Recorded model spending<b>$${spend.toFixed(4)}</b></div><div class="stat">Monthly target<b>$25.00</b></div><div class="stat">Remaining target<b>$${Math.max(0,25-spend).toFixed(2)}</b></div></div><div class="card"><p>Estimates only. No actual model calls are enabled in this deployment.</p></div>`}
else if(section==='Chat'){c.innerHTML=`<div class="card"><h3>Chat with CJ</h3><p>Private AI chat. External actions remain disabled.</p><div class="chatlog" id="chatlog"><div class="bubble theirs">Hello! What can I help you with?</div></div><textarea id="chatprompt" placeholder="Ask CJ AI Clone..." maxlength="3000"></textarea><button class="primary" id="sendchat">Send</button><p id="chaterror" class="error"></p></div>`;$('sendchat').onclick=async()=>{const prompt=$('chatprompt').value.trim();if(!prompt)return;$('sendchat').disabled=true;$('chaterror').textContent='';const mine=document.createElement('div');mine.className='bubble mine';mine.textContent=prompt;$('chatlog').appendChild(mine);$('chatprompt').value='';try{const session=await db.auth.getSession();if(!session.data.session)throw Error('Session expired. Sign in again.');const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.data.session.access_token},body:JSON.stringify({message:prompt,conversation_id:conversationId})});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Server error (HTTP '+response.status+'). Please retry or check Cloudflare Worker logs.')}if(!response.ok)throw Error(data.detail||'Chat unavailable');conversationId=data.conversation_id;const reply=document.createElement('div');reply.className='bubble theirs';reply.textContent=data.answer;$('chatlog').appendChild(reply);if(data.warning)$('chaterror').textContent=data.warning;$('chatlog').scrollTop=$('chatlog').scrollHeight}catch(e){$('chaterror').textContent=e.message}finally{$('sendchat').disabled=false}}}
else{c.innerHTML=`<div class="card"><h3>Your workspace</h3><p>Signed in as ${escapeHtml(user.email)}</p><p>Backend: Cloudflare Python Worker · Database: Supabase</p><p>External actions and autonomous execution are not enabled yet.</p></div>`}
}catch(e){c.innerHTML=`<div class="card error">${escapeHtml(e.message)}</div>`}}
init();
</script></body></html>
